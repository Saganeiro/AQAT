name: Audit Website

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL strony do audytu'
        required: true
        type: string

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright browsers
      run: npx playwright install --with-deps

    - name: Run audit
      run: AUDIT_URL=${{ inputs.url }} npm run test:audit
      env:
        AUDIT_URL: ${{ inputs.url }}

    - name: Upload audit report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: audit-report
        path: |
          playwright-report/
          reports/
          screenshots/

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: test-results/